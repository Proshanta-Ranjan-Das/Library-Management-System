spring.application.name=library-management-system
server.port=8080

# H2 file database (data survives restarts, stored in ./data). Console: /h2-console
spring.datasource.url=jdbc:h2:file:./data/librarydb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI: /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Library business rules
library.loan-days=14
library.max-active-loans=3
library.fine-per-day=5.00
library.seed-data=true
